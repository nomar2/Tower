name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'V*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build dev-debug APK
        env:
          # Optional: add a repository secret named MAPS_API_KEY to use a real
          # Google Maps key. Without it the build falls back to a dead key
          # (the APK still compiles; the map just won't render).
          ORG_GRADLE_PROJECT_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew :Android:assembleDevDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp Android/build/outputs/apk/dev/debug/*.apk "dist/tower-${GITHUB_REF_NAME}-dev-debug.apk"

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tower-dev-debug
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
