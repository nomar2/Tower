# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Suppress warnings for legacy compileSdk / unsupported build tools if needed
android.suppressUnsupportedCompileSdk=36

# Keep resource namespacing lenient for legacy libs
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Workaround for "Illegal char <:>" during mergeResources (AGP 8) when the project
# and the Gradle user home are on different Windows drives.
android.experimental.enableSourceSetPathsMap=false
